name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # abaplint (syntax and code checks), then the ABAP unit tests,
      # transpiled to JavaScript so they run without an SAP system.
      - run: npm test
